name: ConvertmaxSample
options:
  bundleIdPrefix: io.convertmax
  deploymentTarget:
    iOS: "15.0"
  createIntermediateGroups: true
packages:
  Convertmax:
    path: ../..
targets:
  ConvertmaxSample:
    type: application
    platform: iOS
    sources:
      - ConvertmaxSample
    dependencies:
      - package: Convertmax
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: io.convertmax.sample
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_CFBundleDisplayName: Convertmax Sample
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.9"
        TARGETED_DEVICE_FAMILY: "1,2"
schemes:
  ConvertmaxSample:
    build:
      targets:
        ConvertmaxSample: all
